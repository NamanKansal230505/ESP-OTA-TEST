name: OTA build & publish

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write  # create/update the ota-<branch> release

concurrency:
  group: ota-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml cryptography

      - uses: arduino/setup-arduino-cli@v2

      - name: Cache Arduino cores and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-${{ hashFiles('ota.yml') }}
          restore-keys: arduino-${{ runner.os }}-

      - name: Build and sign
        id: build
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: python .github/ota/build.py

      - name: Publish to release ota-${{ steps.build.outputs.channel }}
        if: steps.build.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ota-${{ steps.build.outputs.channel }}
          BUILD: ${{ steps.build.outputs.build }}
        run: bash .github/ota/publish.sh

      - name: Summary
        if: steps.build.outputs.publish == 'true'
        run: |
          {
            echo "### Published build #${{ steps.build.outputs.build }} to channel \`${{ steps.build.outputs.channel }}\`"
            echo ""
            echo "Devices set to branch \`${{ steps.build.outputs.channel }}\` install it on their next reset"
            echo "(or within minutes if the sketch uses \`OTAForever.begin()\`)."
          } >> "$GITHUB_STEP_SUMMARY"
